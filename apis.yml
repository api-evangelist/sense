apis:
- aid: sense:sense-realtime-api
  name: Sense Realtime API
  description: >-
    The Sense Realtime API delivers live electricity usage data via a WebSocket connection, streaming
    second-by-second power consumption readings for the whole home and identified devices. The feed includes
    current wattage draw, solar production output when applicable, grid import and export values, and
    the real-time on/off status of machine-learning identified devices. Clients authenticate using a bearer
    token obtained from the Client API and connect to the secure WebSocket endpoint parameterized with
    the monitor ID.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://sense.com
  baseURL: wss://clientrt.sense.com/monitors
